
<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ======= Balises par défaut (surchargées par react-helmet-async) ======= -->
    <title>DIGiTHOM | Agence de Design Graphique &amp; Branding au Bénin</title>
    <meta name="description" content="DIGiTHOM est une agence de design graphique, branding et communication basée au Bénin. Création de logos, chartes graphiques, web design, impression et formations." />
    <meta name="author" content="DIGiTHOM" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://digithom.com/" />

    <!-- ======= Open Graph ======= -->
    <meta property="og:site_name" content="DIGiTHOM" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="DIGiTHOM | Agence de Design Graphique &amp; Branding au Bénin" />
    <meta property="og:description" content="DIGiTHOM est une agence de design graphique, branding et communication basée au Bénin. Création de logos, chartes graphiques, web design, impression et formations." />
    <meta property="og:image" content="https://digithom.com/lovable-uploads/1f24d38b-a1c7-4a48-86f2-df32e549aa59.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://digithom.com/" />

    <!-- ======= Twitter / X Cards ======= -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@digithom" />
    <meta name="twitter:title" content="DIGiTHOM | Agence de Design Graphique &amp; Branding au Bénin" />
    <meta name="twitter:description" content="DIGiTHOM est une agence de design graphique, branding et communication basée au Bénin." />
    <meta name="twitter:image" content="https://digithom.com/lovable-uploads/1f24d38b-a1c7-4a48-86f2-df32e549aa59.png" />

    <!-- ======= Favicon & Identité ======= -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/lovable-uploads/1f24d38b-a1c7-4a48-86f2-df32e549aa59.png" />
    <meta name="theme-color" content="#E47E01" />
    <meta name="msapplication-TileColor" content="#E47E01" />

    <!-- ======= Google Fonts — chargement optimisé (non-bloquant) ======= -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
      />
    </noscript>
  </head>

  <body>
    <!-- Lien d'évitement pour l'accessibilité et le SEO (visuellement masqué) -->

    >
      <!-- Passer au contenu principal -->
